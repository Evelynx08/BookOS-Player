[package]
name = "bookos-player"
version = "0.6.1"
description = "BookOS Music Player"
authors = ["BookOS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
lofty = "0.21"
walkdir = "2"
base64 = "0.22"
mime_guess = "2"
log = "0.4"
# MPRIS: el reproductor no publicaba nada en D-Bus y ni la isla ni la BookBar
# ni el applet de Plasma lo veian.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["sync"] }
futures-util = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true
# opt-level 3 y no "z": el escaneo de la biblioteca (lofty + base64) es trabajo
# de CPU, y optimizar por tamaño lo hacía notablemente más lento.
opt-level = 3
panic = "abort"
